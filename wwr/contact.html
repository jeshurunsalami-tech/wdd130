<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="White Water Rafting company contact page to join us.">
    <meta name="author" content="Jeshurun Salami">
    <title>contact Us-White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting company logo" width="150">
        <div class="grid">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="contact">
            <h1>Rafting Travel</h1>
            <p>BP554 Lomé-Togo</p>
            <p>+228 98 16 15 30</p>
            <p>jeshurunsalami@gmail.com</p>
        </div>
        <div class="information">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d63303.7598880345!2d1.4718553710499234!3d7.411450816692697!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2stg!4v1786029810966!5m2!1sfr!2stg"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div class="name">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="placeholder">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="placeholder">
                </div>

                <div class="purpose">
                    <p>Message Purpose</p>
                    <div class="radio-group">
                        <input type="radio" id="inquiry" name="q1" value="general" required>
                        <label for="inquiry">General Inquiry</label>

                        <input type="radio" id="question" name="q1" value="reservation" required>
                        <label for="question">Reservation Question</label>

                        <input type="radio" id="suggestion" name="q1" value="website" required>
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>

                    <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe
                        me
                        to
                        the monthly newsletter</label>

                    <button type="submit">Get in touch!</button>
                </div>
            </form>
        </div>
        <div class="more">
            <h2>We Are Here to Serve You</h2>
            <div class="employee_container">
                <div class="employee">
                    <img src="images/sam_wonder_profile.jpeg" alt="Manager Profile" width="150">
                    <p>Sam Wonder</p>
                    <p>Manager</p>
                </div>

                <div class="employee">
                    <img src="images/mary_jones_profile.jpg" alt="Receptionist Profile" width="150">
                    <p>Mary Jones</p>
                    <p>Receptionist</p>
                </div>

                <div class="employee">
                    <img src="images/david_brown_profile.jpg" alt="Guide Profile" width="150">
                    <p>David Brown</p>
                    <p>Guide</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy;2026 🌴 Rafting Travel🌴 Jeshurun Salami</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon" width="75">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="LinkedIn Icon" width="75">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon" width="80">
            </a>
        </nav>
    </footer>
</body>

</html>
